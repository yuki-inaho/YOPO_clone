[project]
name = "yopo"
version = "3.3.0"
description = "YOPO: You Only Pose Once — RGB-D category-level 9D pose (MMDetection-based, RTX 5090 / CUDA 12.8 stack)"
readme = "README.md"
requires-python = ">=3.10,<3.11"
# RTX 5090 (sm_120) stack. PyTorch 2.8.0's cu128 wheels provide Blackwell
# support. MMCV is the prebuilt sm_120 wheel from yuki-inaho/mmcv, compiled
# against the same Torch/CUDA ABI.
#
# The `yopo` package itself is NOT pip-installed (it is the repo root, a renamed
# MMDetection fork). It is made importable develop-style by `just sync` (a .pth
# file pointing at the repo root). mmcv is the prebuilt RTX 5090 / sm_120 2.2.0
# wheel (no source build); mmengine comes from PyPI. Because the package is not
# built, YOPO's own setup.py `install_requires` (requirements/runtime.txt) are
# NOT applied — so every MMDet/YOPO runtime dep is listed explicitly below.
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "numpy<2",
    "mmcv==2.2.0",
    "mmengine>=0.7.1,<1.0.0",
    "setuptools<81",
    "wheel",
    # --- OpenMMLab / MMDetection runtime deps (requirements/runtime.txt + the
    #     transitive deps mmengine/mmcv expect at import time) ---
    "addict",
    "pyyaml",
    "rich",
    "termcolor",
    "yapf",
    "matplotlib",
    "packaging",
    "prettytable",
    "pycocotools",
    "scipy",
    "shapely",
    "six",
    "terminaltables",
    "tqdm",
    "einops",
    "importlib-metadata",
    "opencv-python",
    "pillow",
    # --- YOPO category-level 9D pose extras (yopo/datasets/pose_estimation,
    #     yopo/evaluation/metrics) ---
    "plyfile",
    "scikit-learn",
    # --- Optimizers (Muon + Schedule-Free, from the DEIM training stack) ---
    "muon-optimizer",
    "schedulefree==1.4.1",
    # --- Experiment monitoring (TensorBoard via mmengine TensorboardVisBackend) ---
    "tensorboard",
]

[dependency-groups]
dev = [
    "ipykernel",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.uv.sources]
muon-optimizer = { git = "https://github.com/KellerJordan/Muon.git", rev = "f98f1cacc0263b04290753e32be8d498c1efc806" }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
# Prebuilt full MMCV (with CUDA ops) for RTX 5090 / sm_120, built against
# torch 2.8.0 + CUDA 12.8. The specialized wheel avoids an unsupported
# source build and is required by the RGB-D and rotated-box code paths.
mmcv = { url = "https://github.com/yuki-inaho/mmcv/releases/download/cu128-wheels-v0.1/mmcv-2.2.0-0sm120t280-cp310-cp310-linux_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 88
target-version = "py310"
